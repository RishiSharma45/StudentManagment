<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🎓 Student Management Dashboard</h1>

   <div class="stats">

    <div class="card">
        <h2 id="totalStudents">0</h2>
        <p>Total Students</p>
    </div>

    <div class="card">
        <h2 id="totalMarks">0</h2>
        <p>Class Obtained Marks</p>
    </div>

    <div class="card">
        <h2 id="averageMarks">0</h2>
        <p>Average Percentage</p>
    </div>
    <div class="card">
    <h2 id="topperPercentage">0%</h2>
    <p>Topper Percentage</p>
    
</div>
<div class="card">
    <h2 id="classTotalMark">0</h2>
    <p>Class Total Markings</p>
</div>

</div>

    <div class="form-box">

        <input type="text" id="name" placeholder="Student Name">

        <input type="text" id="roll" placeholder="Roll Number">

        <input type="number"
id="obtainedMarks"
placeholder="Obtained Marks">

<input type="number"
id="totalMarksInput"
placeholder="Total Marks">

        <button class="add-btn" onclick="addStudent()">
            Add Student
        </button>

    </div>
    <div class="form-box">

<input type="text"
id="search"
placeholder="Search Student..."
onkeyup="loadStudents()">

</div>

    <table>

        <thead>
            <tr>
    <th>Name</th>
    <th>Roll</th>
    <th>Obtained</th>
    <th>Total</th>
    <th>Percentage</th>
    <th>Action</th>
</tr>
        </thead>

        <tbody id="studentsTable"></tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
